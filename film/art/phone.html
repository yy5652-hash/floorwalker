<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: var(--paper); }
  .side { position: absolute; left: 190px; top: 330px; width: 640px; }
  .side h1 { font-size: 64px; letter-spacing: -0.03em; margin: 0 0 22px; line-height: 1.05; }
  .side p { font-size: 30px; color: var(--muted); margin: 0; line-height: 1.45; }
  .side .chip { display: inline-flex; gap: 10px; align-items: center; margin-top: 34px; font-size: 28px; font-weight: 600; color: var(--brand); background: #ecfdf5; padding: 10px 20px; border-radius: 999px; }
  .phone { position: absolute; left: 1060px; top: 38px; width: 430px; height: 1004px; border-radius: 64px; background: #0f172a; box-shadow: 0 40px 90px rgba(15, 23, 42, .28), inset 0 0 0 3px #334155; }
  .screen { position: absolute; left: 20px; top: 20px; width: 390px; height: 964px; border-radius: 46px; overflow: hidden; background: #f7f8fa; }
  .screen iframe { width: 390px; height: 964px; border: 0; display: block; }
  .notch { position: absolute; left: 50%; top: 30px; width: 120px; height: 32px; margin-left: -60px; border-radius: 20px; background: #0f172a; z-index: 3; }
  /* The push notification as the phone shows it (Approve and Decline are the notification's own actions). */
  .note { position: absolute; left: 32px; top: 74px; width: 366px; z-index: 2; border-radius: 26px; background: var(--white);
    box-shadow: 0 18px 50px rgba(15, 23, 42, .28), 0 0 0 1px rgba(15, 23, 42, .06); font-family: inherit; opacity: 0; }
  .note .top { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; font-size: 28px; color: var(--muted); letter-spacing: .02em; }
  .note .top img { width: 26px; height: 26px; border-radius: 7px; }
  .note .top b { color: #334155; font-weight: 600; letter-spacing: .04em; }
  .note .top span { margin-left: auto; }
  .note .title { padding: 0 18px; font-size: 28px; font-weight: 650; color: #0f172a; }
  .note .body { padding: 4px 18px 14px; font-size: 28px; line-height: 1.35; color: #334155; }
  .note .actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(15, 23, 42, .08); }
  .note .actions div { padding: 14px 0; text-align: center; font-size: 28px; font-weight: 600; color: var(--brand); }
  .note .actions div + div { border-left: 1px solid rgba(15, 23, 42, .08); color: var(--muted); }
  .scrim { position: absolute; inset: 0; z-index: 1; background: rgba(15, 23, 42, .18); opacity: 0; pointer-events: none; }
.side h1 { font-weight: 550; font-size: 72px; } .side .chip { border-radius: 0; background: transparent; padding: 20px 0 0; border: 0; color: var(--brand); border-top: 1px solid var(--line); } .notch { top: 23px; height: 22px; width: 100px; margin-left: -50px; } .screen iframe { margin-top: 28px; height: 936px; } .note { left: 12px; }

/* Video framing: the real phone layout at a real phone's proportions, enlarged to read in a video. It runs off the bottom of the frame. */
.side { left: 100px; top: 210px; width: 760px; }
.phone { left: 1120px; top: 28px; width: 516px; height: 1140px; border-radius: 72px; }
.notch { top: 24px; }
.screen { left: 14px; top: 14px; width: 488px; height: 1112px; border-radius: 58px; }
.screen iframe { width: 390px; height: 862px; margin-top: 34px; transform: scale(1.25); transform-origin: 0 0; }
.note { left: 14px; top: 62px; width: 460px; }
.note .top { gap: 12px; padding: 18px 20px 8px; font-size: 18px; }
.note .top img { width: 32px; height: 32px; }
.note .title { padding-inline: 20px; font-size: 25px; }
.note .body { padding: 6px 20px 16px; font-size: 21px; }
.note .actions div { font-size: 22px; padding: 16px 0; }
html, body { background: #00443b; }
.side h1, .side p { color: #fff; } .side p { color: #d5efe7; } .side .chip { color: #9fe9d4; border-color: #ffffff30; }
.phone { box-shadow: 0 50px 120px rgba(0,0,0,.45); }
</style></head><body>
<div class="side fade" id="a">
  <h1>Approve from your phone</h1>
  <p>Every request arrives already checked against PayPal's records and your rules. One tap runs exactly that action, once.</p>
  <div class="chip">✓ Rules · PayPal facts · AI review</div>
</div>
<div class="phone"><div class="notch"></div><div class="screen">
  <div class="scrim" id="scrim"></div>
  <div class="note" id="note">
    <div class="top"><img src="/favicon.svg" alt=""><b>FLOORWALKER</b><span>now</span></div>
    <div class="title" id="note-title"></div>
    <div class="body" id="note-body"></div>
    <div class="actions"><div>Approve</div><div>Decline</div></div>
  </div>
  <iframe id="app" src="/approve"></iframe>
</div></div>
<script>
  const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const clamp = v => Math.max(0, Math.min(1, v));
  const show = (id, t, at) => { const e = document.getElementById(id); const p = clamp((t - at) / 0.6); e.style.opacity = p; e.style.transform = `translateY(${18 * (1 - p)}px)`; };
  // The director sets NOTE (text from the recorded request) and NOTE_OUT (when the notification is tapped open).
  window.NOTE = { title: '', body: '' };
  window.NOTE_OUT = 1e9;
  window.render = t => {
    show('a', t, 0.2);
    document.getElementById('note-title').textContent = NOTE.title;
    document.getElementById('note-body').textContent = NOTE.body;
    const inP = ease(clamp((t - 0.4) / 0.5)), outP = ease(clamp((t - NOTE_OUT) / 0.45));
    const note = document.getElementById('note');
    note.style.opacity = NOTE.title ? inP * (1 - outP) : 0;
    note.style.transform = `translateY(${-60 * (1 - inP) - 80 * outP}px) scale(${1 - 0.04 * outP})`;
    document.getElementById('scrim').style.opacity = NOTE.title ? inP * (1 - outP) : 0;
  };
  window.ready = true;
</script></body></html>
