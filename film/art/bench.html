<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FloorwalkerBench · Results</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="cine.css"><link rel="stylesheet" href="sf.css">
<style>
  #sheet { position: absolute; inset: 0; padding: 88px 100px; background: radial-gradient(ellipse at 85% 0%, #6d3df509, transparent 60%), #fff; }
  h1 { margin: 0; font-family: 'Oxanium', sans-serif; font-size: 58px; font-weight: 500; letter-spacing: .07em; }
  #rule { height: 3px; background: var(--prism); margin-top: 28px; }
  table { width: 100%; margin-top: 42px; border-collapse: collapse; table-layout: fixed; }
  col:first-child { width: 32%; }
  col:nth-child(2) { width: 32%; }
  col:last-child { width: 36%; }
  th { height: 112px; text-align: left; vertical-align: top; font-size: 36px; line-height: 1.22; font-weight: 500; color: var(--soft); }
  th small { font-size: 30px; font-weight: 400; }
  th:not(:first-child), td:not(:first-child) { text-align: center; }
  td { height: 134px; border-top: 1px solid #dce2eb; font-size: 48px; font-weight: 500; }
  td:not(:first-child) { font-family: 'Oxanium', sans-serif; font-size: 84px; font-weight: 500; }
  td:first-child { padding-left: 22px; }
  .none td:nth-child(2) { color: #bc153a; }
  .rules td:nth-child(2) { color: #955700; }
  .floorwalker { background: #00a77a0d; }
  .floorwalker td { border-top: 2px solid #008961; border-bottom: 2px solid #008961; font-weight: 650; }
  .floorwalker td:first-child { box-shadow: inset 5px 0 #008961; }
  .floorwalker td:nth-child(2) { color: #007655; }
  #scope { margin: 38px 0 0; text-align: center; font-size: 31px; line-height: 1.4; color: var(--soft); white-space: nowrap; }
</style></head><body>
<main id="sheet">
  <h1>FloorwalkerBench</h1><div id="rule"></div>
  <table aria-label="Benchmark comparison">
    <colgroup><col><col><col></colgroup>
    <thead><tr><th scope="col">Approach</th><th scope="col">Attack value allowed<br><small>(benchmark)</small></th><th scope="col">Owner prompts per 100<br>money moves</th></tr></thead>
    <tbody>
      <tr class="none"><td>No guard</td><td>$3,796</td><td>0</td></tr>
      <tr class="rules"><td>Model with rules</td><td>$52</td><td>49</td></tr>
      <tr class="floorwalker"><td>Floorwalker</td><td>$0</td><td>30</td></tr>
    </tbody>
  </table>
  <p id="scope">198 labelled cases · 80 attacks · average of three runs · simulated PayPal responses</p>
</main>
<script>
  // All rows and final values are visible from frame zero, throughout the narration.
  window.render = t => {};
  window.ready = true;
</script></body></html>
