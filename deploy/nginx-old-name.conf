# The product was called Allowance; its old address redirects to the new one.
server {
    listen 80;
    listen [::]:80;
    server_name allowance.43-160-214-187.sslip.io;
    return 301 https://floorwalker.43-160-214-187.sslip.io$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name allowance.43-160-214-187.sslip.io;
    ssl_certificate /etc/letsencrypt/live/allowance.43-160-214-187.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allowance.43-160-214-187.sslip.io/privkey.pem;
    return 301 https://floorwalker.43-160-214-187.sslip.io$request_uri;
}
