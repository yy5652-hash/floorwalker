<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="stage">
  <div class="logo fade" id="a"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#12233f"/><path d="M11 23V9h11" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 16h9" stroke="#34d399" stroke-width="3" stroke-linecap="round"/></svg>Floorwalker</div>
  <div class="tag fade" id="b">Every refund checked. Fewer taps every week.</div>
  <div class="flow fade" id="c"><div class="box">AI agent</div><div class="arrow">→</div><div class="box mid">Floorwalker</div><div class="arrow">→</div><div class="box">PayPal</div></div>
</div>
<script>
  const show = (id, t, at) => { const e = document.getElementById(id); const p = Math.max(0, Math.min(1, (t - at) / 0.6)); e.style.opacity = p; e.style.transform = `translateY(${18 * (1 - p)}px)`; };
  window.render = t => { show('a', t, 0.1); show('b', t, 0.5); show('c', t, (window.LINES?.t2?.[0] ?? 5) - 0.2); };
  window.ready = true;
</script></body></html>
