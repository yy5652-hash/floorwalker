<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Floorwalker · Try it live</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="cine.css"><link rel="stylesheet" href="sf.css">
<style>
  body { background: radial-gradient(ellipse at 85% 12%, #00b8d90d, transparent 55%), radial-gradient(ellipse at 12% 85%, #6d3df509, transparent 55%), #fff; }
  #lockup { position: absolute; left: 100px; right: 100px; top: 250px; text-align: center; }
  #a { font-size: 108px; letter-spacing: .16em; }
  #b { font-size: 46px; color: var(--soft); margin-top: 34px; }
  #rule { height: 3px; width: 900px; margin: 46px auto 0; background: var(--prism); }
  #d { display: block; font-size: 90px; font-weight: 500; letter-spacing: -.03em; margin-top: 52px; color: var(--violet); text-decoration: none; }
  #e { display: block; font-family: 'JetBrains Mono', monospace; font-size: 34px; margin-top: 28px; color: var(--soft); text-decoration: none; }
</style></head><body>
<main id="lockup">
  <div class="wordmark" id="a">Floorwalker</div>
  <div id="b">Every refund checked. Fewer taps as it learns.</div>
  <div id="rule"></div>
  <a id="d" href="https://floorwalker.yingzhilu.cn">floorwalker.yingzhilu.cn</a>
  <a id="e" href="https://github.com/yy5652-hash/floorwalker">github.com/yy5652-hash/floorwalker</a>
</main>
<script src="cine.js"></script>
<script>
  window.render = t => {
    // Settle early, then hold on the light card through the final cadence and tail.
    rise('a', t, -0.4, 10, 0.8);
    rise('b', t, 0.1, 10, 0.7);
    rise('rule', t, 0.2, 0, 0.7);
    rise('d', t, 0.3, 10, 0.7);
    rise('e', t, 0.5, 10, 0.7);
  };
  window.ready = true;
</script></body></html>
